[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dpir"
version = "0.1.0"
description = "Δ-probed IR pipeline (plan 05): tier-2 code under QUALITY_POLICY.md"
requires-python = ">=3.12"  # 28 Sep 2026: every interpreter in use is 3.12 or 3.14; two probes use 3.12 f-strings
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.8", "pre-commit>=3", "pydantic>=2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "data: needs the committed probe results under probes/results_* (skipped when absent)",
    "slow: runs an electronic-structure code or takes more than a minute (not run in CI)",
]
addopts = "-ra"

[tool.ruff]
line-length = 160
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["*.ipynb", "modules/02_opponent_atlas/data"]   # executed notebooks are artefacts; mai2025 is external code

[tool.ruff.lint]
# One set for every line written or changed anywhere in the plan, judged by tools/ruff_gate.py in the edit hook, pre-commit and CI (CLAUDE.md
# 'Python code', 27 Oct 2026): the CLAUDE.md set joined with the 28 Sep review's correctness rules (subprocess without check,
# try/except/pass, blind except). Lines nobody touched are not judged (TASKS 139).
select = ["E", "F", "W", "B", "SIM", "UP", "C90", "PLR", "RUF", "I", "NPY", "PLW1510", "S110", "BLE001"]
ignore = ["E741", "RUF001", "RUF002", "RUF003", "PLR2004", "PLR0917"]   # the paper's notation (i, j, k, l; Greek) and physical constants

[tool.ruff.lint.pylint]
max-args = 6
