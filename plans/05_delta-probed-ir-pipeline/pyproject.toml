[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dpir"
version = "0.1.0"
description = "Δ-probed IR pipeline (plan 05): tier-2 code under QUALITY_POLICY.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "data: needs the committed probe results under probes/results_* (skipped when absent)",
    "slow: runs an electronic-structure code or takes more than a minute (not run in CI)",
]
addopts = "-ra"

[tool.ruff]
line-length = 160
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E741"]  # single-letter names follow the paper's notation (i, j, k, l)
