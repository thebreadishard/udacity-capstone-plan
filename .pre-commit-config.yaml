# Local hooks under the plan-05 quality policy (plans/05_delta-probed-ir-pipeline/QUALITY_POLICY.md).
# Once per clone:  pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        files: ^plans/05_delta-probed-ir-pipeline/(src|tests|tools|modules)/.*\.py$   # 28 Sep 2026: modules and tools joined (was src|tests)
        exclude: ^plans/05_delta-probed-ir-pipeline/modules/02_opponent_atlas/data/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-ast              # syntax check on every staged Python file (tier 1 included)
      - id: check-added-large-files
        args: ["--maxkb=5000"]  # release sets (data/corpus_release/*.npz) are up to 4 MB (the user, 27 Sep 2026: back them up in git); the 75 MB psi4 .out stays out
      - id: check-merge-conflict
  - repo: local
    hooks:
      - id: check-shell
        name: shell scripts parse and fail fast (bash -n; set -e or a stated reason)
        entry: python plans/05_delta-probed-ir-pipeline/tools/check_shell.py
        language: system
        files: ^plans/05_delta-probed-ir-pipeline/.*\.sh$
        pass_filenames: true
      - id: no-run-scratch
        name: refuse run scratch and live run directories
        entry: python plans/05_delta-probed-ir-pipeline/tools/check_staged_paths.py
        language: system
        pass_filenames: true
