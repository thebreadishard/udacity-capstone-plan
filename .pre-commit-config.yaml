# Local hooks under the plan-05 quality policy (plans/05_delta-probed-ir-pipeline/QUALITY_POLICY.md).
# Once per clone:  pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-ast              # syntax check on every staged Python file (tier 1 included)
      - id: check-added-large-files
        args: ["--maxkb=5000"]  # release sets (data/corpus_release/*.npz) are up to 4 MB (the user, 27 Sep 2026: back them up in git); the 75 MB psi4 .out stays out
      - id: check-merge-conflict
  - repo: local
    hooks:
      - id: ruff-gate
        # 27 Oct 2026: the installed ruff (pinned ruff-pre-commit v0.6.9 disagreed with it on E402 after a sys.path insert), pyproject's one
        # set, on the staged lines only (tools/ruff_gate.py; CLAUDE.md 'Python code')
        name: ruff on the changed lines
        entry: python plans/05_delta-probed-ir-pipeline/tools/ruff_gate.py --staged
        language: system
        files: ^plans/05_delta-probed-ir-pipeline/.*\.py$
        pass_filenames: false
      - id: check-shell
        name: shell scripts parse and fail fast (bash -n; set -e or a stated reason)
        entry: python plans/05_delta-probed-ir-pipeline/tools/check_shell.py
        language: system
        files: ^plans/05_delta-probed-ir-pipeline/.*\.sh$
        pass_filenames: true
      - id: no-run-scratch
        name: refuse run scratch and live run directories
        entry: python plans/05_delta-probed-ir-pipeline/tools/check_staged_paths.py
        language: system
        pass_filenames: true
      - id: tasks-board
        # 27 Oct 2026 (the user): closed rows leave the board for TASKS_closed.md; the board had grown to 396 KB of struck rows
        name: task board - no closed row left on it, every number in one file
        entry: python plans/05_delta-probed-ir-pipeline/tools/tasks_board.py check
        language: system
        files: ^plans/05_delta-probed-ir-pipeline/TASKS(_closed)?\.md$
        pass_filenames: false
