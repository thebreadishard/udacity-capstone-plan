name: plan05

on:
  push:
    paths:
      - "plans/05_delta-probed-ir-pipeline/src/**"
      - "plans/05_delta-probed-ir-pipeline/tests/**"
      - "plans/05_delta-probed-ir-pipeline/probes/*.py"
      - "plans/05_delta-probed-ir-pipeline/probes/*.sh"   # 10 Oct 2026: tests cover watch.sh and cations_after_fivering.sh
      - "plans/05_delta-probed-ir-pipeline/tools/**"
      - "plans/05_delta-probed-ir-pipeline/probes/results_vpt2/**"
      - "plans/05_delta-probed-ir-pipeline/pyproject.toml"
      - ".github/workflows/plan05-ci.yml"
  pull_request:
    paths:
      - "plans/05_delta-probed-ir-pipeline/**"
      - ".github/workflows/plan05-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plans/05_delta-probed-ir-pipeline
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ruff_gate diffs the pushed range
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the package with its test tools
        run: pip install -e ".[dev]"
      # 30 Sep 2026: the module tests (test_pp_*, test_m03_origin_columns) import torch and pandas through the modules they test;
      # without them collection failed and CI stayed red from 26 Sep unnoticed. CPU torch keeps the install small.
      # scipy for test_m03_origin_columns (module 03's tables); checked in a clean venv built like this job: 109 passed, 7 skipped
      # 13 Oct 2026: geomeTRIC (internal coordinates, Wilson B) — four test files skipped their geomeTRIC parts here, and one test without its
      # importorskip kept CI red for eight hours; the laptop's version, so CI runs what the laptop runs
      # 29 Oct 2026: RDKit for the pipeline's refusals (tests/test_m08_pipeline.py: 18 failures on 7d860867 without it); the laptop's version
      - name: Test dependencies of the module tests (pandas, scipy, CPU torch, geomeTRIC, RDKit)
        run: pip install pandas scipy scikit-learn geometric==1.1.1 rdkit==2026.3.6 && pip install torch --index-url https://download.pytorch.org/whl/cpu
      # 27 Oct 2026: one ruff set (pyproject.toml) on the lines the pushed commits change, as the edit hook and pre-commit do
      - name: Ruff on the changed lines (tools/ruff_gate.py)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          case "$BASE" in ''|0000000000000000000000000000000000000000) BASE=$(git rev-parse HEAD~1) ;; esac
          python tools/ruff_gate.py --range "$BASE..${{ github.sha }}"
      - name: Syntax check on the probes (tier 1)
        run: python -m compileall -q probes
      - name: Fast test suite (synthetic + committed data; a missing data set fails, never skips)
        run: pytest -m "not slow" -q
        env:
          DPIR_REQUIRE_DATA: "1"
